[platformio]
default_envs = Micro-Node-App

[env]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git#v1.1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
debug_build_flags = -O0 -g
debug_init_break = tbreak none
build_flags = -Wno-error=deprecated-declarations
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#v2.2.0

; --- MicroNode (STM32L431, bxCAN) ------------------------------------------
[env:Micro-Node-App]
board = MicroNode
board_build.ldscript = ldscript.ld

; --- CoreNode (STM32H743, FDCAN) -------------------------------------------
[env:Core-Node-App]
board = CoreNode
board_build.ldscript = ldscript.ld

; --- MicroNodePlus (STM32H723, FDCAN) --------------------------------------
[env:Micro-Node-Plus-App]
board = MicroNodePlus
board_build.ldscript = ldscript.ld
