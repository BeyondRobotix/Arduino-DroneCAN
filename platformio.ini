[platformio]
default_envs = Micro-Node-App

[env]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git#v1.1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
debug_build_flags = -O0 -g
debug_init_break = tbreak none
build_flags = -Wno-error=deprecated-declarations
; TODO: pin the release tag (v2.3.0?) once libArduinoDroneCAN#6 is merged and tagged.
; Until then, that PR's commit: H7 hand-over fix (one BeginFirmwareUpdate is enough)
; and the 30 s firmware-OK mark BR_bootloader uses after a watchdog reset.
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#ca8087220e5eca4a3a25ad458d5d483236c6463f

; --- MicroNode (STM32L431, bxCAN) ------------------------------------------
[env:Micro-Node-App]
board = MicroNode
board_build.ldscript = ldscript.ld

; --- CoreNode (STM32H743, FDCAN) -------------------------------------------
[env:Core-Node-App]
board = CoreNode
board_build.ldscript = ldscript.ld

; --- MicroNodePlus (STM32H723, FDCAN) --------------------------------------
[env:Micro-Node-Plus-App]
board = MicroNodePlus
board_build.ldscript = ldscript.ld
