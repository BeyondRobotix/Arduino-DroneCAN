[platformio]
default_envs = Micro-Node-App

[env]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git#v1.1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
debug_build_flags = -O0 -g
debug_init_break = tbreak none
build_flags = -Wno-error=deprecated-declarations
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#v2.0.0

; --- MicroNode (STM32L431, bxCAN) ------------------------------------------
[env:Micro-Node-App]
board = MicroNode
board_build.ldscript = ldscript.ld

; --- CoreNode (STM32H743, FDCAN) -------------------------------------------
[env:Core-Node-App]
board = CoreNode
board_build.ldscript = ldscript.ld

; --- MicroNodePlus (STM32H723, FDCAN) --------------------------------------
[env:Micro-Node-Plus-App]
board = MicroNodePlus
board_build.ldscript = ldscript.ld

; --- MicroNodeC5 (STM32C532, FDCAN) -- UNVERIFIED --------------------------
; No PlatformIO registry access was available to build/test this env. See
; br_platformio_hwdef's MicroNodeC5 board and libArduinoDroneCAN's canC5xx
; driver for the rest of this port; both README.md files flag it unverified.
;
; platform/lib_deps overridden to the port branch (not yet in any tagged
; release -- [env]'s v1.1/v2.0.0 pins predate STM32C5 support). Repoint at
; real tags once br_platformio_hwdef and libArduinoDroneCAN cut ones that
; include it.
[env:Micro-Node-C5-App]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git#claude/stm32c532-arduino-drone-port-us8hi5
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#claude/stm32c532-arduino-drone-port-us8hi5
board = MicroNodeC5
board_build.ldscript = ldscript.ld
